<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Proof</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="deck.css"><style>html,body{margin:0;background:var(--dc-ink-200)}
.banner{box-sizing:border-box;width:1078px;background:linear-gradient(105deg,#0B5BE8 0%,#0A55E0 55%,#0733B8 100%);border-radius:22px;height:239px;display:flex;align-items:center;padding:0 64px}

.tile b{font:var(--fw-bold) 38px/1 var(--font-display);letter-spacing:var(--ls-display)}
.tile span{font:var(--fw-bold) 22px/1.2 var(--font-core)}
</style></head>
