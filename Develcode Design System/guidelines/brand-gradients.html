<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-core);background:var(--dc-white);color:var(--text-body)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);height:160px">
