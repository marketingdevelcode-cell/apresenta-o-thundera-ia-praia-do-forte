<!-- @dsCard group="Colors" viewport="700x170" name="Semantic aliases" subtitle="What to reach for in product UI, light and dark register" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-core);background:var(--dc-white);color:var(--text-body)}</style></head><body><div style="padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;font:400 12px/1.5 var(--font-secondary)">
<div style="background:var(--surface-page);border:1px solid var(--border-subtle);border-radius:12px;padding:14px">
<div style="color:var(--text-strong);font:700 14px var(--font-core)">--text-strong</div>
<div style="color:var(--text-body)">--text-body</div><div style="color:var(--text-muted)">--text-muted</div><div style="color:var(--text-accent)">--text-accent</div>
</div>
<div data-theme="dark" style="background:var(--surface-page);border:1px solid var(--border-subtle);border-radius:12px;padding:14px">
<div style="color:var(--text-strong);font:700 14px var(--font-core)">--text-strong</div>
<div style="color:var(--text-body)">--text-body</div><div style="color:var(--text-muted)">--text-muted</div><div style="color:var(--text-accent)">--text-accent</div>
</div></div></body></html>
