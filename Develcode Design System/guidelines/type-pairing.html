<!-- @dsCard group="Type" viewport="700x210" name="Satoshi + Montserrat" subtitle="Primary carries structure; secondary carries supporting layers" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-core);background:var(--dc-white)}</style></head>
<body><div style="padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:24px">
<div style="display:grid;gap:6px">
<div style="font:var(--fw-bold) var(--fs-caption)/1 var(--font-core);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--dc-blue-600)">Primary · Satoshi</div>
<div style="font:italic var(--fw-bold) 44px/1 var(--font-display);letter-spacing:var(--ls-display);color:var(--dc-ink-1000)">Shift</div>
<div style="font:var(--fw-bold) var(--fs-h4)/1.2 var(--font-core);color:var(--dc-ink-1000)">Product Engineering</div>
<div style="font:var(--fw-regular) var(--fs-body-sm)/1.5 var(--font-core);color:var(--dc-ink-700)">Headings, buttons, labels, UI.</div>
</div>
<div style="display:grid;gap:6px">
<div style="font:var(--fw-bold) var(--fs-caption)/1 var(--font-core);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--dc-blue-600)">Secondary · Montserrat</div>
<div style="font:var(--fw-semibold) var(--fs-h4)/1.2 var(--font-secondary);color:var(--dc-ink-1000)">Resultados Obtidos</div>
<div style="font:var(--fw-regular) var(--fs-body-sm)/1.55 var(--font-secondary);color:var(--dc-ink-700)">Supporting copy, eyebrows, metric and table text — a cooler, wider second layer.</div>
<div style="font:var(--fw-medium) var(--fs-body-sm)/1.4 var(--font-secondary);color:var(--dc-ink-900)">300.000 · +80% · -30%</div>
</div>
</div></body></html>
