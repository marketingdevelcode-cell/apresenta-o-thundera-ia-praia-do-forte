<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Status only — never decorative; blue carries the brand" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-core);background:var(--dc-white);color:var(--text-body)}</style></head><body><div style="padding:16px;display:flex;gap:10px">
<div style="flex:1"><div style="height:64px;border-radius:10px;background:var(--dc-success);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div><div style="margin-top:8px;font:700 12px/1.2 var(--font-core);color:var(--dc-ink-900)">success</div><div style="font:400 11px/1.3 var(--font-secondary);color:var(--dc-ink-500)">#10B57F</div></div><div style="flex:1"><div style="height:64px;border-radius:10px;background:var(--dc-warning);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div><div style="margin-top:8px;font:700 12px/1.2 var(--font-core);color:var(--dc-ink-900)">warning</div><div style="font:400 11px/1.3 var(--font-secondary);color:var(--dc-ink-500)">#F5A524</div></div><div style="flex:1"><div style="height:64px;border-radius:10px;background:var(--dc-danger);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div><div style="margin-top:8px;font:700 12px/1.2 var(--font-core);color:var(--dc-ink-900)">danger</div><div style="font:400 11px/1.3 var(--font-secondary);color:var(--dc-ink-500)">#E5484D</div></div><div style="flex:1"><div style="height:64px;border-radius:10px;background:var(--dc-info);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div><div style="margin-top:8px;font:700 12px/1.2 var(--font-core);color:var(--dc-ink-900)">info</div><div style="font:400 11px/1.3 var(--font-secondary);color:var(--dc-ink-500)">#026BF0</div></div>
<div style="flex:1"></div></div></body></html>
